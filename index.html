p:15px;align-items:center;margin-bottom:22px}.top h1{margin:0 0 4px;font-size:26px}.actions{display:flex;gap:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e2e2e2;border-radius:13px;padding:18px}.label{font-size:12px;color:#777}.metric{font-size:26px;font-weight:800;margin-top:8px}.section{margin-top:18px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e2e2e2;border-radius:12px;overflow:hidden}.table th,.table td{padding:13px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.tag{display:inline-block;padding:5px 8px;border:1px solid #ddd;border-radius:99px;font-size:11px}.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.column{background:#eee;border-radius:10px;padding:10px;min-height:180px}.lead{background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px;margin:7px 0;font-size:12px}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:10}.modalbox{background:#fff;border-radius:16px;padding:22px;width:min(700px,100%);max-height:90vh;overflow:auto}.toast{position:fixed;right:18px;bottom:18px;background:#111;color:#fff;padding:12px 15px;border-radius:9px;z-index:20}.public{max-width:760px;margin:auto}.proposal{background:#fff}.phead{padding:30px;text-align:center;border-bottom:1px solid #eee}.hero{font-size:42px;font-weight:900;margin:14px}.pbody{padding:24px}.pbox{border:1px solid #ddd;border-radius:10px;padding:16px;display:grid;gap:5px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.accept{width:100%;padding:14px;background:#111;color:#fff;border:0;border-radius:10px;font-weight:800;cursor:pointer}.mobilebar{display:none}.proposal-name{font-weight:800;text-decoration:none;color:#111;cursor:pointer}.proposal-name:hover{text-decoration:underline}.interest{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid #ddd}.interest.hot{background:#fff1f1;color:#b42318;border-color:#ffd2d2}.interest.view{background:#fff8e7;color:#8a5b00;border-color:#f3dfa8}.interest.accept{background:#ecfdf3;color:#067647;border-color:#abefc6}.interest.wait{background:#f5f5f5;color:#666}.eng-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.timeline{display:grid;gap:9px}.event{display:grid;grid-template-columns:145px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid #eee}.event:last-child{border-bottom:0}.mini{font-size:11px}.progress{height:9px;background:#eee;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:#111;border-radius:99px}.analysis-extra{margin-top:16px;padding:16px;border:1px solid #e2e2e2;border-radius:12px;background:#fafafa}.analysis-extra h3{margin:0 0 6px}.notice{padding:12px 14px;border:1px solid #ead7ad;background:#fffaf0;border-radius:10px;color:#6c4b00;font-size:12px;line-height:1.5}.calcbox{padding:12px 14px;background:#f5f5f5;border:1px solid #ddd;border-radius:10px;margin-top:10px}.subgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.proposal-note{border-left:4px solid #d89a32;background:#fffaf0;padding:13px 15px;border-radius:8px}.proposal-feature{border:1px solid #ddd;border-radius:10px;padding:16px;margin-top:12px}.proposal-feature strong.big{font-size:22px}.good{color:#067647}.warn{color:#8a5b00}

.analysis-wizard{max-width:1180px;margin:0 auto;padding:6px 4px 40px}.modal.analysis-page-mode{left:245px;background:#f5f5f5;display:block;padding:0;overflow:auto}.modal.analysis-page-mode .modalbox{width:100%;max-width:none;min-height:100vh;max-height:none;overflow:visible;border-radius:0;padding:28px 34px;background:#f5f5f5}.modal.analysis-page-mode .analysis-wizard>h2{font-size:28px;margin:0 0 5px}.modal.analysis-page-mode .analysis-section,.modal.analysis-page-mode .analysis-extra{background:#fff}.modal.analysis-page-mode .analysis-actions{position:sticky;bottom:0;background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px;box-shadow:0 -8px 24px #0000000d;z-index:2}.modal.analysis-page-mode .file-drop{margin-top:22px}@media(max-width:800px){.modal.analysis-page-mode{left:0}.modal.analysis-page-mode .modalbox{padding:18px 14px}.modal.analysis-page-mode .analysis-wizard>h2{font-size:24px}}.analysis-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.analysis-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.analysis-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}

.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.check{display:flex;gap:8px;align-items:center;border:1px solid #e5e5e5;padding:10px;border-radius:8px}.check input{width:auto}
.analysis-actions{display:flex;gap:8px;flex-wrap:wrap}.doc-preview{font-size:12px;margin-top:8px;color:#666}.mini-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.presentation{max-width:920px}.presentation .hero{padding:20px;border:1px solid #ddd;border-radius:14px}.presentation .metric-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.presentation .metric{border:1px solid #e5e5e5;border-radius:10px;padding:12px}.presentation .metric span{font-size:11px;color:#777;display:block}.presentation .metric b{font-size:18px}

.creator-banner{background:#111;color:#fff;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:12px}.creator-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.creator-card{background:#fff;border:1px solid #ddd;border-radius:13px;padding:15px}.creator-card .big{font-size:25px;font-weight:800;margin-top:7px}.status-ok{color:#17764c;font-weight:800}.status-bad{color:#b53a3f;font-weight:800}.test-banner{background:#fff1c9;border:1px solid #e3bd4d;padding:12px;border-radius:10px;font-weight:800;margin-bottom:14px}.creator-table{width:100%;border-collapse:collapse}.creator-table th,.creator-table td{padding:10px 8px;border-bottom:1px solid #eee;text-align:left;font-size:12px}.creator-table th{font-size:10px;text-transform:uppercase;color:#777}.pill{display:inline-block;padding:5px 8px;border-radius:20px;background:#eee;font-size:10px;font-weight:800}.pill.green{background:#e8f5ee;color:#17764c}.pill.red{background:#fbe9ea;color:#b53a3f}.creator-actions{display:flex;gap:7px;flex-wrap:wrap}.health-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.health-item{padding:14px;border:1px solid #ddd;border-radius:10px;background:#fff;display:flex;justify-content:space-between}@media(max-width:850px){.creator-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.creator-grid,.health-list{grid-template-columns:1fr}.creator-table{min-width:700px}.table-scroll{overflow:auto}}

.side{display:flex;flex-direction:column}.nav{overflow:auto;padding-bottom:12px}.side-profile{margin-top:auto;border-top:1px solid #2c2c2c;padding:14px 10px 2px;display:flex;gap:10px;align-items:center}.side-avatar{width:34px;height:34px;border-radius:9px;background:#2a2a2a;display:grid;place-items:center;font-weight:900}.side-profile b{display:block;font-size:12px}.side-profile small{display:block;color:#888;font-size:10px;margin-top:2px}
.proposal-tools{background:#fff;border:1px solid #e2e2e2;border-radius:13px;padding:14px;margin-bottom:14px}.proposal-search{position:relative}.proposal-search input{padding-left:38px}.proposal-search:before{content:'⌕';position:absolute;left:14px;top:9px;font-size:20px;color:#999}.proposal-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.proposal-tab{border:1px solid #e2e2e2;background:#fafafa;border-radius:9px;padding:11px;cursor:pointer;text-align:center;font-size:11px;font-weight:800;color:#666}.proposal-tab.active{background:#111;color:#fff;border-color:#111}.proposal-tab span{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:#eee;color:#333;margin-left:5px}.proposal-tab.active span{background:#fff;color:#111}.proposal-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.proposal-card{background:#fff;border:1px solid #e2e2e2;border-radius:13px;padding:15px;display:flex;flex-direction:column;min-height:330px}.pc-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.pc-status,.pc-product{display:inline-block;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:800}.pc-status{background:#eaf0ff;color:#4169a9}.pc-status.accepted{background:#e8f5ee;color:#17764c}.pc-status.refused{background:#fbe9ea;color:#b53a3f}.pc-product{background:#edf7f1;color:#17764c}.pc-expired{color:#b53a3f;font-size:11px;font-weight:800;margin-top:7px}.pc-name{font-size:14px;font-weight:900;margin:14px 0 2px}.pc-info{display:grid;gap:8px;margin-top:10px}.pc-info div{font-size:11px;color:#777}.pc-info b{display:block;color:#222;font-size:12px;margin-top:2px}.pc-economy b{color:#17764c}.pc-actions{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:7px;padding-top:15px}.pc-actions button{padding:9px 7px;font-size:10px}.btn.green{background:#1d9a57;border-color:#1d9a57;color:#fff}.btn.red{background:#c83e45;border-color:#c83e45;color:#fff}.pc-more{grid-column:1/-1;text-align:right;position:relative}.pc-more button{padding:4px 8px}.empty-proposals{grid-column:1/-1;text-align:center;padding:35px;background:#fff;border:1px solid #e2e2e2;border-radius:13px;color:#777}
@media(max-width:1100px){.proposal-cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.proposal-cards,.proposal-tabs{grid-template-columns:1fr}.side-profile{display:none}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><div class="crm-login-logo"><img src="/assets/crm-by-mac-logo.png" alt="CRM by mac"></div><p class="muted">Acesso seguro à operação.</p><p class="muted" style="font-size:11px">Ao entrar, seus dados serão tratados para autenticação e operação do CRM. <a href="#" onclick="privacyInfo();return false">Política de Privacidade</a></p><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn dark" style="width:100%" onclick="login()">Entrar</button><p id="loginMsg" class="muted"></p></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand" id="brand">CRM</div><div id="nav" class="nav"></div><div id="sideProfile" class="side-profile"></div></aside><main class="main"><div id="view"></div></main><div id="mobilebar" class="mobilebar"></div></div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div id="modalbox" class="modalbox"></div></div><div id="toast" class="toast hidden"></div>
<script>
const S={user:null,company:null,cache:{},creatorCache:{}};const menusCreator=[['creatorDashboard','Visão Geral'],['creatorCompanies','Empresas'],['creatorAdmins','Administradores'],['creatorUsers','Usuários'],['creatorPlans','Planos e Recursos'],['creatorIntegrations','Integrações'],['creatorHealth','Saúde do Sistema'],['creatorAudit','Auditoria'],['creatorSupport','Suporte'],['creatorSandbox','Ambiente de Testes'],['creatorSettings','Configurações']];const menusAdmin=[['dashboard','Dashboard'],['leads','Leads'],['analyses','Análises e Propostas'],['campaigns','Campanhas'],['opportunities','Oportunidades'],['sales','Vendas'],['goals','Metas'],['clients','Clientes'],['tasks','Tarefas'],['reports','Relatórios'],['finance','Financeiro'],['team','Equipe'],['config','Configurações'],['profile','Meu Perfil']];const menusConsult=[['dashboard','Meu Painel'],['leads','Meus Leads'],['analyses','Análises e Propostas'],['campaigns','Campanhas'],['opportunities','Oportunidades'],['sales','Minhas Vendas'],['goals','Minhas Metas'],['clients','Meus Clientes'],['tasks','Minhas Tarefas'],['reports','Meus Relatórios'],['profile','Meu Perfil']];
async function api(path,opts={}){const r=await fetch('/.netlify/functions/'+path,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d.message||'Erro');Object.assign(e,d);throw e}return d}
async function login(){try{const payload={action:'login',email:email.value,password:password.value};const code=document.getElementById('totpLogin')?.value;if(code)payload.totp_code=code;const d=await api('auth',{method:'POST',body:JSON.stringify(payload)});S.user=d.user;await boot();}catch(e){loginMsg.textContent=e.message;if(e.two_factor_required||String(e.message).includes('duas etapas'))showLogin2FA()}}
function showLogin2FA(){if(document.getElementById('totpLogin'))return;const p=document.createElement('div');p.className='field';p.innerHTML='<label>Código de autenticação</label><input id="totpLogin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"><small class="muted">Abra seu aplicativo autenticador e informe o código de 6 dígitos.</small>';password.closest('.field')?.after(p)}
async function boot(){const isCreator=['creator','platform_staff'].includes(S.user.role);S.company=isCreator?{trade_name:'CRM by mac • CRIADOR'}:await api('config');document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('brand').textContent=S.company.trade_name||S.company.name||'CRM';buildNav();const sp=document.getElementById('sideProfile');if(sp&&!isCreator){const nm=S.user.name||S.user.email||'Usuário';sp.innerHTML=`<div class="side-avatar">${esc(nm.charAt(0).toUpperCase())}</div><div><b>${esc(nm)}</b><small>${S.user.role==='admin'?'Administrador':'Consultor'}</small></div>`}go(isCreator?'creatorDashboard':'dashboard')}
async function check(){try{const d=await api('auth',{method:'POST',body:JSON.stringify({action:'me'})});if(d.user){S.user=d.user;await boot()}}catch{}}
function buildNav(){const m=['creator','platform_staff'].includes(S.user.role)?menusCreator:(S.user.role==='admin'?menusAdmin:menusConsult);nav.innerHTML=m.map(([id,t])=>`<button data-n="${id}" onclick="go('${id}')">${t}</button>`).join('');mobilebar.innerHTML=m.slice(0,8).map(([id,t])=>`<button onclick="go('${id}')">${t}</button>`).join('')}
async function load(r){if(!S.cache[r])S.cache[r]=await api('data?resource='+r);return S.cache[r]}
function header(t,sub='',btn=''){return `<div class="top"><div><h1>${t}</h1><div class="muted">${sub}</div></div><div class="actions">${btn}</div></div>`}
function go(p){document.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('active',x.dataset.n===p));const f={dashboard,leads,analyses,proposals,campaigns,opportunities,sales,goals,clients,tasks,reports,finance,team,config,profile,creatorDashboard,creatorCompanies,creatorAdmins,creatorUsers,creatorPlans,creatorIntegrations,creatorHealth,creatorAudit,creatorSupport,creatorSandbox,creatorSettings}[p];if(f)f()}
function cards(a){return `<div class="grid">${a.map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('')}</div>`}

async function creatorGet(action,refresh=false){if(refresh)delete S.creatorCache[action];if(!S.creatorCache[action])S.creatorCache[action]=await api('creator?action='+action);return S.creatorCache[action]}
function creatorBanner(){return `<div class="creator-banner"><b>CRIADOR DA PLATAFORMA</b> • Você está no painel global. Dados de empresas reais e do ambiente de testes ficam separados.</div>`}
async function creatorDashboard(){const d=await creatorGet('overview',true);view.innerHTML=header('Visão Geral da Plataforma','Controle global da operação')+creatorBanner()+`<div class="creator-grid">
<div class="creator-card"><span class="muted">Empresas</span><div class="big">${d.companies?.count||0}</div><small>${d.companies?.active||0} ativas</small></div>
<div class="creator-card"><span class="muted">Usuários</span><div class="big">${d.users?.count||0}</div><small>${d.admins?.count||0} admins • ${d.consultants?.count||0} consultores</small></div>
<div class="creator-card"><span class="muted">Leads reais</span><div class="big">${d.leads?.count||0}</div><small>Sandbox excluído</small></div>
<div class="creator-card"><span class="muted">Propostas reais</span><div class="big">${d.proposals?.count||0}</div><small>${d.analyses?.count||0} análises</small></div>
<div class="creator-card"><span class="muted">Vendas registradas</span><div class="big">${d.sales?.count||0}</div><small>${money(d.sales?.total||0)}</small></div>
<div class="creator-card"><span class="muted">Documentos processados</span><div class="big">${d.documents?.count||0}</div><small>Consumo de leitura documental</small></div>
<div class="creator-card"><span class="muted">Erros 24h</span><div class="big">${d.errors24h?.count||0}</div><small>Integrações monitoradas</small></div>
<div class="creator-card"><span class="muted">Ambiente teste</span><div class="big">${d.companies?.test||0}</div><small>Não entra nos indicadores reais</small></div></div>
<div class="section"><div class="card"><b>Atividade recente da plataforma</b><div style="margin-top:10px">${(d.recent||[]).map(x=>`<div class="row"><div><b>${esc(x.title)}</b><div class="muted">${esc(x.company_name||'Plataforma')} • ${new Date(x.created_at).toLocaleString('pt-BR')}</div></div><span class="pill">${esc(x.type)}</span></div>`).join('')||'<p class="muted">Nenhuma atividade registrada ainda.</p>'}</div></div></div>`}

let ANALYSIS_FILTER='waiting';
function proposalEffectiveStatus(p){if(!p)return 'Sem link';if(p.status==='Aceita')return 'Aceita';if(p.status==='Recusada')return 'Recusada';if(p.expires_at&&new Date(p.expires_at)<new Date())return 'Expirada';return p.status||'Enviada'}

async function analyses(){
 const rows=await load('analyses'),props=await load('proposals');
 const items=rows.map(a=>({a,p:props.filter(z=>z.analysis_id===a.id&&z.status!=='Substituída').sort((x,y)=>new Date(y.created_at)-new Date(x.created_at))[0]}));
 const counts={waiting:items.filter(x=>!x.p||!['Aceita','Recusada'].includes(proposalEffectiveStatus(x.p))).length,accepted:items.filter(x=>proposalEffectiveStatus(x.p)==='Aceita').length,contracted:0,refused:items.filter(x=>proposalEffectiveStatus(x.p)==='Recusada').length};
 const sales=await load('sales').catch(()=>[]);counts.contracted=items.filter(x=>x.p&&sales.some(s=>s.proposal_id===x.p.id)).length;

function solveInstallments(){
 const ids={total:'na-total-installments',paid:'na-paid-installments',remaining:'na-remaining-installments'};
 const vals={total:Number(val(ids.total)),paid:Number(val(ids.paid)),remaining:Number(val(ids.remaining))};
 const filled=installmentManualOrder.filter(k=>val(ids[k])!=='');
 if(filled.length<2){updateInstallmentStates(null);updateIdentifiedRate();runAnalysisAssistant();return}
 const auto=['total','paid','remaining'].find(k=>!filled.includes(k));
 const a=filled[0],b=filled[1];let result=0;
 if(auto==='remaining')result=vals.total-vals.paid;
 if(auto==='paid')result=vals.total-vals.remaining;
 if(auto==='total')result=vals.paid+vals.remaining;
 const target=document.getElementById(ids[auto]);
 if(result<0){target.value='';target.setCustomValidity('A combinação de parcelas resulta em valor negativo.');updateInstallmentStates(auto,true)}
 else{target.setCustomValidity('');target.value=String(Math.max(0,Math.round(result)));updateInstallmentStates(auto,false)}

}

function estimatePriceMonthlyRate(principal,payment,n){
 principal=Number(principal);payment=Number(payment);n=Number(n);
 if(!(principal>0&&payment>0&&n>0)||payment*n<=principal)return null;
 let lo=0,hi=1;
 for(let i=0;i<100;i++){const r=(lo+hi)/2;const pv=payment*(1-Math.pow(1+r,-n))/r;if(pv>principal)lo=r;else hi=r}
 return (lo+hi)/2;
}

function runAnalysisAssistant(){

 if(total&&paid>total)issues.push('Parcelas pagas estão maiores que o prazo total.');
 if(total&&remaining>total)issues.push('Parcelas restantes estão maiores que o prazo total.');
 if(total&&paid>=0&&remaining>=0&&paid+remaining!==total)issues.push('A soma de parcelas pagas e restantes não confere com o prazo total.');
 if(!val('na-client'))issues.push('Informe o cliente.');
 if(!val('na-bank'))issues.push('Banco/instituição ainda não foi informado.');
 if(val('na-interest-enabled')==='Sim'){
   if(!val('na-contract-rate'))issues.push('A comparação de juros está ativa, mas a taxa do contrato não foi preenchida/validada.');
   if(!val('na-presented-rate'))issues.push('A comparação de juros está ativa, mas falta definir a taxa que será apresentada.');
   if(val('na-contract-rate-period')!==val('na-presented-rate-period'))issues.push('As taxas estão em periodicidades diferentes. Confira antes de apresentar ao cliente.');
 }
 if(val('na-amort-enabled')==='Sim'){
   if(!num(val('na-financed-value'))||!num(val('na-current-balance')))issues.push('Comparativo de amortização ativo sem valor financiado ou saldo devedor.');
 }
 if(val('na-balloon')==='Sim'&&!num(val('na-balloon-value')))issues.push('Parcela balão ativada sem valor preenchido.');
 const box=document.getElementById('analysis-assistant');if(box){box.className='assistant-box '+(issues.length?'warn':'ok');box.innerHTML=issues.length?`<b>Assistente da análise:</b> revise ${issues.length} ponto(s).<ul>${issues.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<b>Assistente da análise:</b> nenhuma inconsistência básica identificada.`}
 return issues;
}

function percentField(id,label,placeholder='Ex.: 8,51'){
  return `<div class="field"><label>${label}</label><div class="percent-wrap"><input id="${id}" inputmode="decimal" placeholder="${placeholder}" oninput="maskPercent(this);if(this.id==='na-discount-percent')calculateProposalValues(false)" onblur="if(this.value)this.value=percentNum(this.value).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})"><span>%</span></div></div>`

function maskPercent(el){
  let raw=String(el.value||'').replace(/[^\d,\.]/g,'').replace('.',',');
  const parts=raw.split(',');
  if(parts.length>2) raw=parts.shift()+','+parts.join('');
  el.value=raw;
}

function percentNum(v){return Math.max(0,Math.min(100,Number(String(v||'0').replace('%','').replace(',','.'))||0))}

function toggleProposalCalcMode(){
 const automatic=val('na-calc-mode')!=='manual';
 ['na-proposal-value','na-refund','na-monthly-saving','na-revised-installment'].forEach(id=>{const el=document.getElementById(id);if(el)el.readOnly=automatic});
 const d=document.getElementById('na-discount-percent');if(d)d.disabled=!automatic;

function calculateProposalValues(showToast=false){
 if(val('na-calc-mode')==='manual')return true;
 const discount=percentNum(val('na-discount-percent')),product=val('na-product'),financed=num(val('na-financed-base')),balance=num(val('na-balance-base')),current=num(val('na-current-installment')),total=Math.max(0,Number(val('na-total-installments')||0)),paid=Math.max(0,Number(val('na-paid-installments')||0));
 const warning=document.getElementById('na-calc-warning');if(warning)warning.classList.add('hidden');
 if(discount<0||discount>100){if(showToast)toast('Informe um desconto entre 0% e 100%.');return false}
 let revised=0,monthly=0,refund=0,economy=0,finalTotal=0;
 if(product==='Quitação'){
   if(!balance){if(showToast)toast('Informe o saldo devedor atual para calcular a quitação.');return false}
   revised=balance*(1-discount/100);economy=balance-revised;finalTotal=revised;
 }else{
   if(!current||!total){if(showToast)toast('Informe a parcela atual e o total de parcelas para calcular automaticamente.');return false}
   revised=current*(1-discount/100);monthly=current-revised;refund=monthly*paid;economy=monthly*total;finalTotal=revised*total;
 }
 if(financed>0&&finalTotal<financed){
   const msg=`O desconto informado gera um valor final de ${money(finalTotal)}, abaixo do valor financiado de ${money(financed)}. Reduza o percentual ou use preenchimento manual após conferir os dados.`;
   if(warning){warning.textContent=msg;warning.classList.remove('hidden')}if(showToast)toast('Desconto inválido: valor final abaixo do valor financiado.');return false;
 }
 setMoneyValue('na-revised-installment',revised);setMoneyValue('na-monthly-saving',monthly);setMoneyValue('na-refund',refund);setMoneyValue('na-proposal-value',economy);return true;
}

function modal(c){modalbox.innerHTML=c;document.getElementById('modal').classList.remove('hidden')}function closeModal(){const m=document.getElementById('modal');m.classList.add('hidden');m.classList.remove('analysis-page-mode')}function field(id,l,type='text',ph=''){return `<div class="field"><label>${l}</label><input id="${id}" type="${type}" placeholder="${ph}"></div>`}function select(id,l,opts){return `<div class="field"><label>${l}</label><select id="${id}">${opts.map(x=>`<option value="${x}">${x}${id==='np-hours'?' horas':''}</option>`).join('')}</select></div>`}function val(id){return document.getElementById(id)?.value||''}function num(v){return Number(String(v).replace(/\./g,'').replace(',','.'))||0}function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function duration(v){v=Math.max(0,Number(v||0));const h=Math.floor(v/3600),m=Math.floor((v%3600)/60),s=Math.floor(v%60);return h?`${h}h ${m}min`:m?`${m}min ${s}s`:`${s}s`}function date(v){return v?new Date(v).toLocaleString('pt-BR'):'—'}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t){toastEl=t;const x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2500)}

let PUBLIC_TRACK={token:null,session:null,last:Date.now(),scroll:0,timer:null};
function proposalScroll(){const de=document.documentElement,b=document.body;const top=window.scrollY||de.scrollTop||0,max=Math.max(1,Math.max(b.scrollHeight,de.scrollHeight)-innerHeight);PUBLIC_TRACK.scroll=Math.max(PUBLIC_TRACK.scroll,Math.min(100,Math.round(top/max*100)))}
async function sendProposalTrack(closing=false){if(!PUBLIC_TRACK.token||!PUBLIC_TRACK.session)return;const now=Date.now();let delta=0;if(document.visibilityState==='visible')delta=Math.min(30,Math.max(0,Math.round((now-PUBLIC_TRACK.last)/1000)));PUBLIC_TRACK.last=now;const payload={action:'track',session:PUBLIC_TRACK.session,active_seconds:delta,scroll_percent:PUBLIC_TRACK.scroll,reached_end:PUBLIC_TRACK.scroll>=95,closing};try{if(closing&&navigator.sendBeacon){navigator.sendBeacon('/.netlify/functions/public-proposal?token='+encodeURIComponent(PUBLIC_TRACK.token),new Blob([JSON.stringify(payload)],{type:'text/plain'}))}else await fetch('/.netlify/functions/public-proposal?token='+encodeURIComponent(PUBLIC_TRACK.token),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),keepalive:true})}catch{}}
function startProposalTracking(token,session){PUBLIC_TRACK={token,session,last:Date.now(),scroll:0,timer:setInterval(()=>sendProposalTrack(false),10000)};addEventListener('scroll',proposalScroll,{passive:true});document.addEventListener('visibilitychange',()=>{sendProposalTrack(false);PUBLIC_TRACK.last=Date.now()});addEventListener('pagehide',()=>sendProposalTrack(true),{once:true});proposalScroll()}

function apMoney(v){return money(Number(v||0))}
function apRate(v,period){return v!==undefined&&v!==null&&v!==''?`${String(v).replace('.',',')}% ${esc(period||'')}`:'—'}
function apContractData(p,q){
 const rows=[];
 const add=(a,b)=>{if(b!==undefined&&b!==null&&b!==''&&b!==0)rows.push(`<div><span>${a}</span><b>${typeof b==='number'?apMoney(b):esc(b)}</b></div>`)};
 add('Banco',q.bank);add('Sistema',q.amortization_system);
 if(q.show_interest_comparison)add('Taxa contratada',apRate(q.contract_interest_rate,q.contract_interest_period));
 if(q.total_installments)add('Parcelas',`${q.total_installments} • ${q.paid_installments||0} pagas`);
 add('Valor financiado',Number(q.financed_value||0));add('Saldo devedor atual',Number(q.current_balance||0));
 if(p.product==='Veículo'){add('Veículo',q.vehicle);add('Modalidade',q.operation_type)}
 if(p.product==='Empréstimo Pessoal')add('Modalidade',q.operation_type||'Empréstimo pessoal');
 return rows.length?`<section class="ap-card"><div class="ap-title">Dados do contrato</div><div class="ap-contract">${rows.join('')}</div></section>`:'';
}
function apAmort(q){
 if(!q.show_amortization_comparison)return '';
 const fin=Number(q.financed_value||0),exp=Number(q.expected_amortization||0),act=Number(q.actual_amortization||0),diff=Math.max(0,exp-act);
 const ep=fin?Math.min(100,exp/fin*100):0,ap=fin?Math.min(100,act/fin*100):0;
 return `<section class="ap-card"><div class="ap-title">Evolução da amortização</div><div class="ap-amort"><div class="ap-amort-kpi"><span>Amortização esperada</span><b>${apMoney(exp)}</b></div><div class="ap-amort-kpi"><span>Amortização identificada</span><b>${apMoney(act)}</b></div></div><div class="ap-amort-chart"><div class="ap-barhead"><span>Esperada</span><b>${ep.toLocaleString('pt-BR',{maximumFractionDigits:1})}%</b></div><div class="ap-bar"><div class="ap-fill" style="width:${ep}%"></div></div><div class="ap-barhead"><span>Identificada</span><b>${ap.toLocaleString('pt-BR',{maximumFractionDigits:1})}%</b></div><div class="ap-bar"><div class="ap-fill actual" style="width:${ap}%"></div></div>${q.has_extraordinary_amortization?`<div class="ap-alert" style="border-color:#d7d7d7;background:#fafafa;color:#333"><b>Amortização extraordinária</b><br>${Number(q.extraordinary_amortized_installments||0)} parcela(s) abatida(s) • ${apMoney(q.extraordinary_amortization_value)} pagos extraordinariamente.<br>Esse valor reduz o prazo/saldo e não compõe o estorno estimado.</div>`:''}${diff?`<div class="ap-alert"><b>Diferença identificada: ${apMoney(diff)}.</b><br>Até o momento analisado, a redução do principal ficou abaixo da amortização esperada informada para o contrato.</div>`:''}</div></section>`;
}
function apInstallment(q){
 if(!(Number(q.current_installment)>0||Number(q.revised_installment)>0))return '';
 return `<section class="ap-card"><div class="ap-title">Como fica sua parcela</div><div class="ap-compare"><div class="ap-box ap-current"><div class="ap-lbl">ATUAL</div><div class="ap-price">${apMoney(q.current_installment)}</div><div class="ap-save" style="color:#777">por mês</div></div><div class="ap-box ap-revised"><div class="ap-lbl">REVISADA</div><div class="ap-price">${apMoney(q.revised_installment)}</div>${Number(q.monthly_saving)>0?`<div class="ap-save">↓ ${apMoney(q.monthly_saving)} de economia/mês</div>`:''}</div></div>${q.remaining_installments?`<div class="ap-meta">${q.remaining_installments} parcelas restantes</div>`:''}</section>`;
}
function apImpact(p,q){
 if(p.product==='Quitação')return `<section class="ap-card"><div class="ap-title">Condição de quitação</div><div class="ap-metrics"><div class="ap-metric"><span>Saldo atual</span><b>${apMoney(q.current_balance)}</b></div><div class="ap-metric ap-green"><span>Desconto</span><b>${Number(q.discount_percent||0).toLocaleString('pt-BR')}%</b></div><div class="ap-metric ap-refund"><span>Valor para quitar</span><b>${apMoney(q.payoff_amount)}</b></div></div></section>`;
 if(!(q.monthly_saving||q.estimated_refund))return '';return `<section class="ap-card"><div class="ap-title">Impacto financeiro</div><div class="ap-metrics"><div class="ap-metric ap-green"><span>Economia mensal</span><b>${apMoney(q.monthly_saving)}</b></div><div class="ap-metric ap-refund"><span>Estorno estimado</span><b>${apMoney(q.estimated_refund)}</b></div></div></section>`;
}
function apFindings(q){
 const findings=[];
 const period=q.interest_period||q.contract_interest_period||q.charged_interest_period||'a.m.',rates=[];if(q.identified_interest_rate)rates.push(['Identificada',q.identified_interest_rate]);if(q.contract_interest_rate)rates.push(['Contratada',q.contract_interest_rate]);if(q.correct_interest_rate||q.charged_interest_rate)rates.push(['Correta',q.correct_interest_rate||q.charged_interest_rate]);if(rates.length)findings.push(`<div class="ap-finding"><div class="ap-smalltitle">TAXA DE JUROS</div>${rates.map(r=>`<div class="ap-pair"><span>${r[0]}</span><b>${apRate(r[1],period)}</b></div>`).join('')}</div>`);
 if(q.show_amortization_comparison&&q.expected_amortization!==undefined)findings.push(`<div class="ap-finding"><div class="ap-smalltitle">AMORTIZAÇÃO</div><div class="ap-pair"><span>Prevista</span><b>${apMoney(q.expected_amortization)}</b></div><div class="ap-pair"><span>Identificada</span><b class="ap-danger">${apMoney(q.actual_amortization)}</b></div></div>`);
 return findings.length?`<section class="ap-card"><div class="ap-title">Pontos identificados</div><div class="ap-findings">${findings.join('')}</div></section>`:'';
}
function apOverdue(q){return q.has_overdue_installments?`<section class="ap-card"><div class="ap-title">Parcelas em atraso</div><div class="ap-extra-grid"><div class="ap-extra"><span>Quantidade em atraso</span><b>${Number(q.overdue_installments_count||0)} parcelas</b></div><div class="ap-extra"><span>Valor aproximado em atraso</span><b>${apMoney(q.overdue_total)}</b></div></div><div class="ap-note"><b>Observação:</b> ${esc(q.overdue_note||'Poderá ser solicitada a inclusão das parcelas em atraso dentro do acordo.')}</div></section>`:''}
function apBalloon(q){return q.has_balloon?`<section class="ap-card"><div class="ap-title">Parcela balão</div><div class="ap-extra-grid"><div class="ap-extra"><span>Valor original</span><b>${apMoney(q.balloon_amount)}</b></div><div class="ap-extra"><span>Desconto</span><b>${Number(q.balloon_discount_percent||0).toLocaleString('pt-BR')}%</b></div><div class="ap-extra"><span>Valor com desconto</span><b>${apMoney(q.balloon_discounted_amount)}</b></div><div class="ap-extra"><span>Condição</span><b>${q.balloon_chosen_installments?`${q.balloon_chosen_installments}x de ${apMoney(q.balloon_installment_amount)}`:'—'}</b></div></div></section>`:''}
function apLaw(){
 return `<section class="ap-card"><div class="ap-title">Base legal da análise</div><div class="ap-lawrow"><div class="ap-law"><b>Art. 6º, V — CDC</b>Permite a revisão de cláusulas com prestações desproporcionais ou onerosidade excessiva.</div><div class="ap-law"><b>Art. 51 — CDC</b>Permite questionar cláusulas que coloquem o consumidor em desvantagem exagerada.</div></div></section>`;
